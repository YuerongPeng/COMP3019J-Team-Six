{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" class="narrow">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>
  <button>Sign in</button>
</form>
<p class="hint">Demo accounts, password for each: alex@example.com, mei@example.com, staff@example.com, maya@example.com</p>
<p class="hint">No account yet? <a href="{{ url_for('membership.register_form') }}">Register</a></p>
{% endblock %}
