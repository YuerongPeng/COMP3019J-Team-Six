{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="post" class="narrow">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required minlength="6">
  <label for="confirm">Confirm password</label>
  <input id="confirm" name="confirm" type="password" required>
  <button>Register</button>
</form>
<p class="hint">Already have an account? <a href="{{ url_for('access.login') }}">Sign in</a></p>
<p class="hint">Want to join as an instructor or staff member? Ask reception or an administrator to set up your account for you.</p>
{% endblock %}
